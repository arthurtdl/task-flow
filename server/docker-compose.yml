services:
  server:
    build:
      context: .
      dockerfile: dev.Dockerfile
    image: taskflow-server
    container_name: taskflow-server
    restart: unless-stopped
    env_file: .env
    ports:
      - '${SERVER_PORT:-3001}:3001'
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./src
          target: /home/node/app/src
        - action: sync
          path: ./prisma
          target: /home/node/app/prisma
        - action: rebuild
          path: package.json

  db:
    image: postgres:15-alpine
    container_name: taskflow-db
    restart: unless-stopped
    env_file: .env
    environment:
      - POSTGRES_USER=${DATABASE_USER:-postgres}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD:-postgres}
      - POSTGRES_DB=${DATABASE_DB:-taskflow_db}
    ports:
      - '${DATABASE_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_DB:-taskflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: